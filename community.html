<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>여행자 추천 픽 & 나만의 픽 - optvoyage</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>

  <!-- Sticky Header -->
  <header class="site-header">
    <div class="header-left">
      <button class="back-btn" id="backBtn" aria-label="뒤로가기"><i class="fa-solid fa-arrow-left"></i></button>
      <a href="index.html" class="logo-wrap">
        <div class="logo-title" style="font-size: 19px;">여행자 픽 & 나만의 픽</div>
      </a>
    </div>
    <div class="header-right">
      <button class="header-icon-btn" id="menuBtn" aria-label="메뉴"><i class="fa-solid fa-ellipsis-vertical"></i></button>
      <div class="chrome-dropdown" id="dropdownMenu">
        <div class="dropdown-header">optvoyage 메뉴</div>
        <a href="index.html" class="dropdown-item"><i class="fa-solid fa-house"></i> <span>홈으로 이동</span></a>
        <a href="search.html" class="dropdown-item"><i class="fa-solid fa-sliders"></i> <span>세부 픽 검색</span></a>
        <a href="random.html" class="dropdown-item"><i class="fa-solid fa-dice"></i> <span>운명의 랜덤 픽</span></a>
        <a href="search.html?view=bookmarks" class="dropdown-item"><i class="fa-solid fa-heart"></i> <span>보관함</span></a>
        <a href="https://buymeacoffee.com/djawjdaks8g" target="_blank" rel="noopener noreferrer" class="dropdown-item">
          <i class="fa-solid fa-mug-hot" style="color: #ffdd00;"></i> <span>개발자 응원하기</span>
        </a>
        <a href="privacy.html" class="dropdown-item"><i class="fa-solid fa-shield-halved"></i> <span>프라이버시</span></a>
      </div>
    </div>
  </header>

  <main class="container" style="padding-top: 24px;">

    <!-- Create My Pick Card -->
    <div style="background: #ffffff; border-radius: var(--radius-lg); border: 1px solid #e2e8f0; padding: 24px; box-shadow: var(--shadow-sm); margin-bottom: 32px;">
      <h2 style="font-size: 20px; font-weight: 800; color: var(--text-main); margin-bottom: 8px; display: flex; align-items: center; gap: 8px;">
        <i class="fa-solid fa-wand-magic-sparkles" style="color: var(--primary-600);"></i>
        <span>나만의 픽 만들기 & 공유</span>
      </h2>
      <p style="font-size: 14px; color: var(--text-muted); margin-bottom: 20px;">
        내가 좋아하는 여행 조건을 조합해 나만의 여행 픽을 만들고 친구에게 링크를 공유해보세요!
      </p>

      <div style="margin-bottom: 16px;">
        <label style="display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px;">픽 제목</label>
        <input type="text" id="myPickTitle" placeholder="예: 🎄 크리스마스 로맨틱 야경 픽 / 🐶 댕댕이와 계곡 힐링" style="width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none;">
      </div>

      <div style="margin-bottom: 16px;">
        <label style="display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px;">픽 소개 한 줄</label>
        <input type="text" id="myPickDesc" placeholder="예: 가성비 좋은 숙소와 찐맛집 위주로 즐기는 알뜰 코스" style="width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none;">
      </div>

      <div style="margin-bottom: 20px;">
        <label style="display: block; font-size: 13px; font-weight: 700; margin-bottom: 8px;">태그 추가 (클릭하여 선택)</label>
        <div style="display: flex; flex-wrap: wrap; gap: 6px;" id="pickAvailableTags"></div>
      </div>

      <button id="createAndShareBtn" class="btn-large-action" style="width: 100%;">
        <i class="fa-solid fa-share-nodes"></i> 나만의 픽 저장 & 친구 공유 링크 복사
      </button>
    </div>

    <!-- Community Curated Picks -->
    <div class="section-header">
      <h2 class="section-title">
        <i class="fa-solid fa-users" style="color: #d97706;"></i>
        <span>여행자들이 추천하는 인기 픽</span>
      </h2>
    </div>

    <div class="cards-grid" id="communityGrid" style="grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));"></div>

  </main>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <a href="index.html" class="bottom-nav-item">
      <i class="fa-solid fa-house"></i>
      <span>홈</span>
    </a>
    <a href="search.html" class="bottom-nav-item">
      <i class="fa-solid fa-magnifying-glass"></i>
      <span>세부 픽</span>
    </a>
    <a href="community.html" class="bottom-nav-item active">
      <i class="fa-solid fa-users"></i>
      <span>여행자 픽</span>
    </a>
    <a href="random.html" class="bottom-nav-item">
      <i class="fa-solid fa-dice"></i>
      <span>랜덤 픽</span>
    </a>
    <a href="search.html?view=bookmarks" class="bottom-nav-item">
      <i class="fa-solid fa-heart"></i>
      <span>보관함</span>
    </a>
  </nav>

  <script type="module" src="js/community.js"></script>
</body>
</html>
