<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>여행자 픽 - optvoyage</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>

  <header class="site-header">
    <div class="header-left">
      <button class="back-btn" id="backBtn"><i class="fa-solid fa-arrow-left"></i></button>
    </div>
    <div class="header-center">
      <a href="index.html" class="logo-wrap">
        <span class="logo-title">optvoyage</span>
        <span class="header-page-title">여행자 픽</span>
      </a>
    </div>
    <div class="header-right">
      <button class="header-icon-btn" id="menuBtn"><i class="fa-solid fa-bars"></i></button>
    </div>
  </header>

  <main class="container" style="padding-top: 20px;">
    <div class="create-pick-card">
      <div class="create-pick-header">
        <i class="fa-solid fa-wand-magic-sparkles" style="color: var(--primary-600); font-size: 22px;"></i>
        <div>
          <h2 class="create-pick-title">나만의 맞춤 픽 제작 및 공유</h2>
          <p class="create-pick-sub">원하는 세부 조건들을 선택해 나만의 여행 조합을 만들어보세요!</p>
        </div>
      </div>

      <div class="form-group">
        <label>나만의 픽 제목</label>
        <input type="text" id="myPickTitle" placeholder="예: 🦕 공룡발자국과 청정계곡 힐링 픽">
      </div>

      <div class="form-group">
        <label>소개글</label>
        <input type="text" id="myPickDesc" placeholder="예: 아이와 함께 떠나기 딱 좋은 1박 2일 코스">
      </div>

      <div class="form-group">
        <label>포함할 세부 픽 선택</label>
        <div class="tag-chips-flex" id="pickAvailableTags"></div>
      </div>

      <button id="createAndShareBtn" class="btn-large-action" style="width: 100%;">
        <i class="fa-solid fa-share-nodes"></i> 나만의 픽 저장 및 링크 생성
      </button>
    </div>

    <div class="section-header">
      <h2 class="section-title"><i class="fa-solid fa-users" style="color: #d97706;"></i> 여행자들이 공유한 픽 컬렉션</h2>
    </div>

    <div class="cards-grid" id="communityGrid"></div>
  </main>

  <nav class="bottom-nav">
    <a href="index.html" class="bottom-nav-item"><i class="fa-solid fa-house"></i><span>홈</span></a>
    <a href="search.html" class="bottom-nav-item"><i class="fa-solid fa-sliders"></i><span>세부 픽</span></a>
    <a href="community.html" class="bottom-nav-item active"><i class="fa-solid fa-users"></i><span>여행자 픽</span></a>
    <a href="random.html" class="bottom-nav-item"><i class="fa-solid fa-dice"></i><span>랜덤 픽</span></a>
    <a href="search.html?view=bookmarks" class="bottom-nav-item"><i class="fa-solid fa-heart"></i><span>보관함</span></a>
  </nav>

  <script type="module" src="js/community.js"></script>
</body>
</html>
