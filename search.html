<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>150+ 세부 픽 조합 검색 - optvoyage</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>

  <header class="site-header">
    <div class="header-left">
      <button class="back-btn" id="backBtn"><i class="fa-solid fa-arrow-left"></i></button>
    </div>
    <div class="header-center">
      <a href="index.html" class="logo-wrap">
        <span class="logo-title">optvoyage</span>
        <span class="header-page-title">세부 픽</span>
      </a>
    </div>
    <div class="header-right">
      <button class="header-icon-btn" id="resetBtn" title="초기화"><i class="fa-solid fa-rotate-left"></i></button>
      <button class="header-icon-btn" id="menuBtn"><i class="fa-solid fa-bars"></i></button>

      <div class="chrome-dropdown" id="dropdownMenu">
        <div class="dropdown-header">optvoyage 메뉴</div>
        <a href="index.html" class="dropdown-item"><i class="fa-solid fa-house"></i> 홈으로 이동</a>
        <a href="community.html" class="dropdown-item"><i class="fa-solid fa-users"></i> 여행자 추천 픽</a>
        <a href="random.html" class="dropdown-item"><i class="fa-solid fa-dice"></i> 운명의 랜덤 픽</a>
        <a href="search.html?view=bookmarks" class="dropdown-item"><i class="fa-solid fa-heart"></i> 내가 찜한 보관함</a>
      </div>
    </div>
  </header>

  <main class="container" style="padding-top: 16px;">

    <div class="main-search-bar" style="margin-bottom: 16px; display: flex; gap: 8px;">
      <input type="text" id="keywordInput" placeholder="지역, 계곡, 유적지, 공룡발자국 키워드 입력..." style="flex: 1; padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px;">
      <button id="keywordSearchBtn" class="btn-large-action" style="width: 80px;">검색</button>
    </div>

    <!-- 픽 조합기 카드 -->
    <div class="pick-selector-card">
      <div class="pick-selector-header">
        <div class="pick-header-title">
          <i class="fa-solid fa-sliders" style="color: var(--primary-600);"></i>
          <span>150+ 세부 취향 픽 선택기</span>
        </div>
        <span class="pick-helper-text">태그를 조합하면 실시간으로 해당 여행지가 고파집니다</span>
      </div>

      <div class="category-tabs-bar" id="categoryTabsBar"></div>

      <div class="tag-chips-wrap" id="tagChipsBox">
        <div class="tag-chips-header" id="currentCatTitle">태그 목록</div>
        <div class="tag-chips-flex" id="currentCatTags"></div>
      </div>
    </div>

    <!-- 선택된 픽 요약 -->
    <div id="activeFilterSummary" class="active-filter-summary">
      <div class="summary-left">
        <span class="summary-label"><i class="fa-solid fa-check"></i> 내가 고른 픽:</span>
        <div class="active-tags-container" id="activeTagsContainer"></div>
      </div>
      <button id="clearAllTagsBtn" class="clear-all-btn"><i class="fa-solid fa-xmark"></i> 전체 해제</button>
    </div>

    <div class="search-result-meta-bar">
      <div class="result-title-group">
        <h2 class="search-result-heading" id="searchResultTitle">내가 선택한 픽의 검색 결과</h2>
        <span class="result-count-badge">총 <strong id="resultTotalCount">0</strong>곳</span>
      </div>
      <a href="https://3ha.in/r/725499" target="_blank" class="aff-badge-link"><i class="fa-solid fa-bed"></i> 선택 지역 숙소 특가</a>
    </div>

    <div class="cards-grid" id="searchResultsGrid"></div>

    <div style="height: 40px;"></div>
  </main>

  <nav class="bottom-nav">
    <a href="index.html" class="bottom-nav-item"><i class="fa-solid fa-house"></i><span>홈</span></a>
    <a href="search.html" class="bottom-nav-item active"><i class="fa-solid fa-sliders"></i><span>세부 픽</span></a>
    <a href="community.html" class="bottom-nav-item"><i class="fa-solid fa-users"></i><span>여행자 픽</span></a>
    <a href="random.html" class="bottom-nav-item"><i class="fa-solid fa-dice"></i><span>랜덤 픽</span></a>
    <a href="search.html?view=bookmarks" class="bottom-nav-item"><i class="fa-solid fa-heart"></i><span>보관함</span></a>
  </nav>

  <script type="module" src="js/search.js"></script>
</body>
</html>
