<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>여행지 상세 - optvoyage</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>

  <header class="site-header">
    <div class="header-left">
      <button class="back-btn" id="backBtn"><i class="fa-solid fa-arrow-left"></i></button>
    </div>
    <div class="header-center">
      <a href="index.html" class="logo-wrap"><span class="logo-title">optvoyage</span></a>
    </div>
    <div class="header-right">
      <button class="header-icon-btn" id="menuBtn"><i class="fa-solid fa-bars"></i></button>
      <div class="chrome-dropdown" id="dropdownMenu">
        <div class="dropdown-header">optvoyage 메뉴</div>
        <a href="index.html" class="dropdown-item"><i class="fa-solid fa-house"></i> 홈으로 이동</a>
        <a href="search.html" class="dropdown-item"><i class="fa-solid fa-sliders"></i> 세부 픽 검색</a>
      </div>
    </div>
  </header>

  <div class="detail-hero-banner">
    <img id="detailImg" class="detail-hero-img" src="" alt="여행지 대표 이미지">
    <div class="detail-img-gradient"></div>
  </div>

  <main class="detail-body-container">
    <div class="detail-main-header">
      <div class="detail-badge-group">
        <span class="card-tag-pill" id="detailCategoryBadge">관광지</span>
        <span class="card-tag-pill edu" id="detailEduBadge" style="display: none;"><i class="fa-solid fa-graduation-cap"></i> 학습 탐방지</span>
      </div>
      <h1 class="detail-title" id="detailTitle">여행지 정보를 가져오는 중...</h1>
      <div class="detail-meta-row">
        <span class="meta-rating"><i class="fa-solid fa-star" style="color: #f59e0b;"></i> <span id="detailRating">4.9</span></span>
        <span class="meta-region"><i class="fa-solid fa-location-dot"></i> <span id="detailRegion">전국</span></span>
      </div>
    </div>

    <div class="detail-section-block">
      <h3 class="detail-block-title"><i class="fa-solid fa-align-left" style="color: var(--primary-600);"></i> 여행지 상세 정보</h3>
      <p id="detailDesc" class="detail-desc-text"></p>
    </div>

    <div class="detail-section-block">
      <h3 class="detail-block-title"><i class="fa-solid fa-circle-info" style="color: var(--primary-600);"></i> 위치 안내</h3>
      <div class="detail-info-row"><strong>주소</strong><span id="detailAddress">-</span></div>
      <div class="detail-info-row"><strong>전화번호</strong><span id="detailTel">-</span></div>
    </div>

    <div class="detail-section-block affiliate-detail-box">
      <h3 class="detail-block-title"><i class="fa-solid fa-gift" style="color: #ea580c;"></i> 주변 숙소 및 혜택</h3>
      <div class="aff-deal-list">
        <a href="https://3ha.in/r/725499" target="_blank" class="aff-deal-item">
          <div class="deal-icon" style="background: #e0f2fe; color: #0284c7;"><i class="fa-solid fa-bed"></i></div>
          <div class="deal-info">
            <strong>주변 최저가 숙소 찾기</strong>
            <span>실시간 할인 혜택 제공</span>
          </div>
          <span class="deal-btn">보기 &gt;</span>
        </a>
      </div>
    </div>

    <div class="detail-section-block">
      <h3 class="detail-block-title"><i class="fa-solid fa-tags" style="color: var(--primary-600);"></i> 해당 여행지 세부 픽 키워드</h3>
      <div class="detail-tags-cloud" id="detailTagsGrid"></div>
    </div>
  </main>

  <div class="detail-bottom-bar">
    <div class="detail-bottom-inner">
      <button class="btn-icon-square" id="bottomBookmarkBtn"><i class="fa-regular fa-heart"></i></button>
      <a href="https://3ha.in/r/725499" target="_blank" class="btn-large-affiliate"><i class="fa-solid fa-bed"></i> 주변 숙소 특가</a>
      <a href="#" id="kakaoMapLink" target="_blank" class="btn-large-action"><i class="fa-solid fa-route"></i> 길찾기</a>
    </div>
  </div>

  <script type="module" src="js/detail.js"></script>
</body>
</html>
