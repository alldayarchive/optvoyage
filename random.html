<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>운명의 랜덤 픽 - optvoyage</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>

  <header class="site-header">
    <div class="header-left">
      <button class="back-btn" id="backBtn"><i class="fa-solid fa-arrow-left"></i></button>
    </div>
    <div class="header-center">
      <a href="index.html" class="logo-wrap">
        <span class="logo-title">optvoyage</span>
        <span class="header-page-title">랜덤 픽</span>
      </a>
    </div>
    <div class="header-right">
      <button class="header-icon-btn" id="menuBtn"><i class="fa-solid fa-bars"></i></button>
    </div>
  </header>

  <main class="container" style="max-width: 600px; text-align: center; padding-top: 36px;">
    <div class="random-box-card">
      <h2 style="font-size: 22px; font-weight: 800; margin-bottom: 8px;">주사위를 굴려 운명의 여행지를 선택하세요</h2>
      <p style="font-size: 13.5px; color: var(--text-muted); margin-bottom: 24px;">고민할 필요 없이 오늘 떠날 명소를 뽑아드립니다.</p>

      <div class="dice-wrapper" id="diceBtn"><i class="fa-solid fa-dice-d20"></i></div>

      <div id="diceStatus" style="font-size: 15px; font-weight: 700; margin-bottom: 20px;">터치하여 주사위 굴리기</div>

      <div id="randomResultCard" class="random-result-card" style="display: none;">
        <img id="resultImg" src="" class="random-result-img" alt="랜덤 여행지">
        <div style="padding: 16px;">
          <div class="card-loc" id="resultRegion">지역</div>
          <h3 style="font-size: 18px; font-weight: 800;" id="resultTitle">여행지명</h3>
          <p style="font-size: 13px; color: var(--text-muted); margin: 8px 0 16px 0;" id="resultDesc">설명</p>
          <a href="#" id="resultDetailLink" class="btn-large-action" style="text-decoration: none;">자세히 보기 &rarr;</a>
        </div>
      </div>

      <button id="rerollBtn" class="btn-large-action" style="width: 100%; display: none;">다시 굴리기</button>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="index.html" class="bottom-nav-item"><i class="fa-solid fa-house"></i><span>홈</span></a>
    <a href="search.html" class="bottom-nav-item"><i class="fa-solid fa-sliders"></i><span>세부 픽</span></a>
    <a href="community.html" class="bottom-nav-item"><i class="fa-solid fa-users"></i><span>여행자 픽</span></a>
    <a href="random.html" class="bottom-nav-item active"><i class="fa-solid fa-dice"></i><span>랜덤 픽</span></a>
    <a href="search.html?view=bookmarks" class="bottom-nav-item"><i class="fa-solid fa-heart"></i><span>보관함</span></a>
  </nav>

  <script type="module" src="js/random.js"></script>
</body>
</html>
