<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>운명의 랜덤 픽 - optvoyage</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    .dice-wrapper {
      width: 90px;
      height: 90px;
      margin: 30px auto;
      background: linear-gradient(135deg, #a855f7, #6366f1);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 44px;
      color: #fff;
      box-shadow: 0 10px 25px rgba(99, 102, 241, 0.35);
      cursor: pointer;
      transition: transform 0.2s;
    }
    .dice-wrapper:hover {
      transform: scale(1.05);
    }
    .dice-wrapper.rolling {
      animation: spinDice 0.6s infinite linear;
    }
    @keyframes spinDice {
      0% { transform: rotate(0deg) scale(1.1); }
      50% { transform: rotate(180deg) scale(0.9); }
      100% { transform: rotate(360deg) scale(1.1); }
    }
  </style>
</head>
<body>

  <!-- Sticky Header -->
  <header class="site-header">
    <div class="header-left">
      <button class="back-btn" id="backBtn" aria-label="뒤로가기"><i class="fa-solid fa-arrow-left"></i></button>
      <a href="index.html" class="logo-wrap">
        <div class="logo-title" style="font-size: 19px;">운명의 랜덤 픽</div>
      </a>
    </div>
    <div class="header-right">
      <button class="header-icon-btn" id="menuBtn" aria-label="메뉴"><i class="fa-solid fa-ellipsis-vertical"></i></button>
      <div class="chrome-dropdown" id="dropdownMenu">
        <div class="dropdown-header">optvoyage 메뉴</div>
        <a href="index.html" class="dropdown-item"><i class="fa-solid fa-house"></i> <span>홈으로 이동</span></a>
        <a href="search.html" class="dropdown-item"><i class="fa-solid fa-sliders"></i> <span>세부 픽 검색</span></a>
        <a href="community.html" class="dropdown-item"><i class="fa-solid fa-users"></i> <span>여행자 추천 픽</span></a>
        <a href="search.html?view=bookmarks" class="dropdown-item"><i class="fa-solid fa-heart"></i> <span>보관함</span></a>
        <a href="privacy.html" class="dropdown-item"><i class="fa-solid fa-shield-halved"></i> <span>프라이버시</span></a>
      </div>
    </div>
  </header>

  <main class="container" style="max-width: 600px; text-align: center; padding-top: 40px;">
    
    <div style="background: #ffffff; border-radius: var(--radius-xl); border: 1px solid #e2e8f0; padding: 36px 20px; box-shadow: var(--shadow-sm);">
      <div style="font-size: 13px; font-weight: 700; color: #9333ea; margin-bottom: 8px;">
        <i class="fa-solid fa-sparkles"></i> 어디 갈지 망설여질 때!
      </div>
      <h2 style="font-size: 24px; font-weight: 800; color: var(--text-main); margin-bottom: 8px;">
        주사위를 굴려 운명의 여행지를 뽑아보세요
      </h2>
      <p style="font-size: 14px; color: var(--text-muted); margin-bottom: 24px;">
        optvoyage가 당신의 취향을 담은 깜짝 여행지를 무작위로 추천해드립니다.
      </p>

      <div class="dice-wrapper" id="diceBtn">
        <i class="fa-solid fa-dice-d20"></i>
      </div>

      <div id="diceStatus" style="font-size: 15px; font-weight: 700; color: var(--text-main); margin-bottom: 24px;">
        주사위를 터치하세요!
      </div>

      <div id="randomResultCard" style="display: none; text-align: left; background: var(--primary-50); border: 1px solid var(--primary-200); border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 20px;">
        <img id="resultImg" src="" alt="결과 사진" style="width: 100%; height: 200px; object-fit: cover;">
        <div style="padding: 16px;">
          <div style="font-size: 12px; font-weight: 700; color: var(--primary-600); margin-bottom: 4px;" id="resultRegion">지역</div>
          <h3 style="font-size: 18px; font-weight: 800; color: var(--text-main); margin-bottom: 6px;" id="resultTitle">여행지명</h3>
          <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 14px; line-height: 1.5;" id="resultDesc">설명</p>
          <a href="#" id="resultDetailLink" class="btn-large-action" style="text-align: center; text-decoration: none;">
            이 여행지 자세히 보기 &rarr;
          </a>
        </div>
      </div>

      <button id="rerollBtn" class="btn-large-action" style="width: 100%; background: linear-gradient(135deg, #9333ea, #6366f1);">
        <i class="fa-solid fa-shuffle"></i> 주사위 굴리기
      </button>
    </div>

  </main>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <a href="index.html" class="bottom-nav-item">
      <i class="fa-solid fa-house"></i>
      <span>홈</span>
    </a>
    <a href="search.html" class="bottom-nav-item">
      <i class="fa-solid fa-magnifying-glass"></i>
      <span>세부 픽</span>
    </a>
    <a href="community.html" class="bottom-nav-item">
      <i class="fa-solid fa-users"></i>
      <span>여행자 픽</span>
    </a>
    <a href="random.html" class="bottom-nav-item active">
      <i class="fa-solid fa-dice"></i>
      <span>랜덤 픽</span>
    </a>
    <a href="search.html?view=bookmarks" class="bottom-nav-item">
      <i class="fa-solid fa-heart"></i>
      <span>보관함</span>
    </a>
  </nav>

  <script type="module" src="js/random.js"></script>
</body>
</html>
