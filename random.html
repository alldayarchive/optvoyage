<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>운명의 랜덤 픽 - optvoyage</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" referrerpolicy="no-referrer" />
</head>
<body>

  <header class="site-header">
    <div class="header-left">
      <button class="back-btn" id="backBtn" aria-label="뒤로가기"><i class="fa-solid fa-arrow-left"></i></button>
    </div>
    <div class="header-center">
      <a href="index.html" class="logo-wrap">
        <span class="logo-title">optvoyage</span>
        <span class="header-page-title">랜덤 픽</span>
      </a>
    </div>
    <div class="header-right">
      <a href="https://buymeacoffee.com/djawjdaks8g" target="_blank" rel="noopener noreferrer" class="coffee-sponsor-btn" title="후원하기">
        <i class="fa-solid fa-mug-hot"></i>
      </a>
      <button class="header-icon-btn" id="menuBtn" aria-label="메뉴"><i class="fa-solid fa-bars"></i></button>
      
      <div class="chrome-dropdown" id="dropdownMenu">
        <div class="dropdown-header">optvoyage 메뉴</div>
        <a href="index.html" class="dropdown-item"><i class="fa-solid fa-house"></i> <span>홈으로 이동</span></a>
        <a href="search.html" class="dropdown-item"><i class="fa-solid fa-sliders"></i> <span>세부 픽 검색</span></a>
        <a href="community.html" class="dropdown-item"><i class="fa-solid fa-users"></i> <span>여행자 추천 픽</span></a>
        <a href="search.html?view=bookmarks" class="dropdown-item"><i class="fa-solid fa-heart"></i> <span>보관함</span></a>
        <div class="dropdown-divider"></div>
        <a href="https://buymeacoffee.com/djawjdaks8g" target="_blank" class="dropdown-item highlight-item">
          <i class="fa-solid fa-mug-saucer" style="color: #f59e0b;"></i> <span>개발자 커피 후원</span>
        </a>
        <a href="mailto:offthemain@proton.me" class="dropdown-item">
          <i class="fa-solid fa-envelope"></i> <span>문의</span>
        </a>
        <a href="privacy.html" class="dropdown-item"><i class="fa-solid fa-shield-halved"></i> <span>프라이버시</span></a>
        <a href="terms.html" class="dropdown-item"><i class="fa-solid fa-file-contract"></i> <span>이용약관</span></a>
      </div>
    </div>
  </header>

  <main class="container" style="max-width: 600px; text-align: center; padding-top: 36px;">
    
    <div class="random-box-card">
      <div style="font-size: 13px; font-weight: 700; color: #9333ea; margin-bottom: 8px;">
        <i class="fa-solid fa-sparkles"></i> 어디 갈지 결정하기 힘들 때!
      </div>
      <h2 style="font-size: 24px; font-weight: 800; color: var(--text-main); margin-bottom: 8px;">
        주사위를 굴려 운명의 여행지를 뽑아보세요
      </h2>
      <p style="font-size: 14px; color: var(--text-muted); margin-bottom: 24px;">
        optvoyage가 전국의 숨은 명소, 학습 탐방지, 감성 여행지를 무작위로 추천해 드립니다.
      </p>

      <div class="dice-wrapper" id="diceBtn">
        <i class="fa-solid fa-dice-d20"></i>
      </div>

      <div id="diceStatus" style="font-size: 15px; font-weight: 700; color: var(--text-main); margin-bottom: 24px;">
        주사위를 터치하세요!
      </div>

      <!-- 결과 카드 -->
      <div id="randomResultCard" class="random-result-card" style="display: none;">
        <img id="resultImg" src="" alt="결과 사진" class="random-result-img">
        <div style="padding: 16px;">
          <div class="card-loc" id="resultRegion">지역</div>
          <h3 style="font-size: 19px; font-weight: 800; color: var(--text-main); margin-bottom: 6px;" id="resultTitle">여행지명</h3>
          <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 14px; line-height: 1.5;" id="resultDesc">설명</p>
          
          <div style="display: flex; gap: 8px;">
            <a href="#" id="resultDetailLink" class="btn-large-action" style="flex: 1; text-decoration: none;">
              자세히 보기 &rarr;
            </a>
            <a href="https://3ha.in/r/725499" target="_blank" rel="noopener noreferrer" class="btn-large-affiliate" style="flex: 1; text-decoration: none;">
              <i class="fa-solid fa-bed"></i> 숙소 보기
            </a>
          </div>
        </div>
      </div>

      <button id="rerollBtn" class="btn-large-action" style="width: 100%; background: linear-gradient(135deg, #9333ea, #6366f1);">
        <i class="fa-solid fa-shuffle"></i> 다시 주사위 굴리기
      </button>
    </div>

  </main>

  <nav class="bottom-nav">
    <a href="index.html" class="bottom-nav-item">
      <i class="fa-solid fa-house"></i>
      <span>홈</span>
    </a>
    <a href="search.html" class="bottom-nav-item">
      <i class="fa-solid fa-sliders"></i>
      <span>세부 픽</span>
    </a>
    <a href="community.html" class="bottom-nav-item">
      <i class="fa-solid fa-users"></i>
      <span>여행자 픽</span>
    </a>
    <a href="random.html" class="bottom-nav-item active">
      <i class="fa-solid fa-dice"></i>
      <span>랜덤 픽</span>
    </a>
    <a href="search.html?view=bookmarks" class="bottom-nav-item">
      <i class="fa-solid fa-heart"></i>
      <span>보관함</span>
    </a>
  </nav>

  <script type="module" src="js/random.js"></script>
</body>
</html>
