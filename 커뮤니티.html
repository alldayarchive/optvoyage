<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>여행자 추천 픽 & 나만의 픽 만들기 - optvoyage</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="header-left">
      <button class="back-btn" id="backBtn" aria-label="뒤로가기"><i class="fa-solid fa-arrow-left"></i></button>
    </div>
    <div class="header-center">
      <a href="index.html" class="logo-wrap">
        <span class="logo-title">optvoyage</span>
        <span class="header-page-title">여행자 픽</span>
      </a>
    </div>
    <div class="header-right">
      <a href="https://buymeacoffee.com/djawjdaks8g" target="_blank" rel="noopener noreferrer" class="coffee-sponsor-btn">
        <i class="fa-solid fa-mug-hot"></i>
      </a>
      <button class="header-icon-btn" id="menuBtn" aria-label="메뉴"><i class="fa-solid fa-ellipsis-vertical"></i></button>
      <div class="chrome-dropdown" id="dropdownMenu">
        <div class="dropdown-header">optvoyage 메뉴</div>
        <a href="index.html" class="dropdown-item"><i class="fa-solid fa-house"></i> <span>홈으로 이동</span></a>
        <a href="search.html" class="dropdown-item"><i class="fa-solid fa-sliders"></i> <span>세부 픽 검색</span></a>
        <a href="random.html" class="dropdown-item"><i class="fa-solid fa-dice"></i> <span>운명의 랜덤 픽</span></a>
        <a href="search.html?view=bookmarks" class="dropdown-item"><i class="fa-solid fa-heart"></i> <span>보관함</span></a>
        <div class="dropdown-divider"></div>
        <a href="https://buymeacoffee.com/djawjdaks8g" target="_blank" class="dropdown-item highlight-item">
          <i class="fa-solid fa-mug-saucer" style="color: #f59e0b;"></i> <span>개발자 커피 후원</span>
        </a>
        <a href="support.html" class="dropdown-item"><i class="fa-solid fa-circle-info"></i> <span>고객지원</span></a>
        <a href="privacy.html" class="dropdown-item"><i class="fa-solid fa-shield-halved"></i> <span>프라이버시</span></a>
      </div>
    </div>
  </header>

  <main class="container" style="padding-top: 20px;">

    <!-- 나만의 픽 만들기 카드 -->
    <div class="create-pick-card">
      <div class="create-pick-header">
        <i class="fa-solid fa-wand-magic-sparkles" style="color: var(--primary-600); font-size: 22px;"></i>
        <div>
          <h2 class="create-pick-title">나만의 맞춤 픽 만들기 & 공유</h2>
          <p class="create-pick-sub">선호하는 태그를 조합해 나만의 여행 코스를 만들고 링크를 공유해보세요!</p>
        </div>
      </div>

      <div class="form-group">
        <label>픽 제목</label>
        <input type="text" id="myPickTitle" placeholder="예: 🦕 공룡발자국 & 역사탐방 픽 / 💖 로맨틱 기념일 코스">
      </div>

      <div class="form-group">
        <label>픽 소개 한 줄</label>
        <input type="text" id="myPickDesc" placeholder="예: 아이와 함께 떠나는 알찬 1박2일 지질·역사 탐방 코스">
      </div>

      <div class="form-group">
        <label>태그 선택 (클릭하여 추가/제거)</label>
        <div class="tag-chips-flex" id="pickAvailableTags"></div>
      </div>

      <button id="createAndShareBtn" class="btn-large-action" style="width: 100%;">
        <i class="fa-solid fa-share-nodes"></i> 나만의 픽 저장 및 친구 공유 링크 복사
      </button>
    </div>

    <!-- 바이미어커피 후원 배너 -->
    <div class="coffee-supporter-banner">
      <div class="coffee-icon"><i class="fa-solid fa-mug-hot"></i></div>
      <div class="coffee-content">
        <h4>optvoyage 무료 서비스를 응원해주세요!</h4>
        <p>회원가입 없는 0원 무료 사이트 유지를 위해 개발자에게 따뜻한 커피 한 잔을 선물해주세요 ☕</p>
      </div>
      <a href="https://buymeacoffee.com/djawjdaks8g" target="_blank" rel="noopener noreferrer" class="coffee-donate-action">
        커피 후원하기
      </a>
    </div>

    <!-- 여행자 추천 픽 컬렉션 -->
    <div class="section-header" style="margin-top: 32px;">
      <h2 class="section-title">
        <i class="fa-solid fa-users" style="color: #d97706;"></i>
        <span>여행자들이 추천하는 인기 픽 컬렉션</span>
      </h2>
    </div>

    <div class="cards-grid" id="communityGrid" style="grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));"></div>

    <div style="height: 40px;"></div>
  </main>

  <nav class="bottom-nav">
    <a href="index.html" class="bottom-nav-item">
      <i class="fa-solid fa-house"></i>
      <span>홈</span>
    </a>
    <a href="search.html" class="bottom-nav-item">
      <i class="fa-solid fa-sliders"></i>
      <span>세부 픽</span>
    </a>
    <a href="community.html" class="bottom-nav-item active">
      <i class="fa-solid fa-users"></i>
      <span>여행자 픽</span>
    </a>
    <a href="random.html" class="bottom-nav-item">
      <i class="fa-solid fa-dice"></i>
      <span>랜덤 픽</span>
    </a>
    <a href="search.html?view=bookmarks" class="bottom-nav-item">
      <i class="fa-solid fa-heart"></i>
      <span>보관함</span>
    </a>
  </nav>

  <script type="module" src="js/community.js"></script>
</body>
</html>
